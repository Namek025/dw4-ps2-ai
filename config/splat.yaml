name: Digimon World 4 (NTSC-U, SLUS-20836)
# SHA-1 of the objcopy'd "rom" (loadable bytes only, no ELF metadata).
# The ELF itself is d6c8bbcd6b3a0b3f135f7559d098af088ba06e2a.
sha1: ffad4dab663cb290190bdfa34a8016d616a1652a
options:
  basename: SLUS_208.36
  base_path: ..
  target_path: build/target/SLUS_208.36.rom
  elf_path: build/SLUS_208.36.elf
  platform: ps2
  compiler: EEGCC

  gp_value: 0x0055C870

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/SLUS_208.36.ld

  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  create_asm_dependencies: True
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.txt
  undefined_syms_auto_path: config/undefined_syms_auto.txt
  # include/ is hand-maintained (include_asm.h has an MWCC branch); do not regenerate.
  generate_asm_macros_files: False
  # Also write matched functions (to asm/matchings/): objdiff builds its target objects from them.
  disassemble_all: True
  # Unit .rodata is emitted by tools/mwsplice.py, not split into per-symbol files.
  migrate_rodata_to_functions: False

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  named_regs_for_c_funcs: False
  add_set_gp_64: True

  section_order: [.text, .data, .rodata, .sdata, .sbss, .bss]
  auto_link_sections: [.data, .rodata, .sdata, .sbss, .bss]

